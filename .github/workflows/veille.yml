name: Veille PCB Air France

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan des offres
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot_pcb_airfrance.py --once
      - name: Sauvegarde des offres déjà signalées
        run: |
          git config user.name "bot-veille"
          git config user.email "bot@users.noreply.github.com"
          git add offres_deja_signalees.json
          git diff --cached --quiet || (git commit -m "Nouvelle offre signalée" && git push)
